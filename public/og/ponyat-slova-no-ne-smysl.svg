<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Понять все слова — и не понять смысл</title>
  <desc id="desc">Редакционная обложка о переходе от отдельных понятий к целостной рабочей модели</desc>
