  <path d="M76 102 L91 126 L107 99 M142 74 L158 105 L180 76 M214 56 L230 94 L257 63" fill="none" stroke="#c58a35" stroke-width="3"/>

  <g fill="#111714" font-family="Arial, Helvetica, sans-serif">
